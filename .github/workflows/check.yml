name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.name }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            optional: false
            name: check (ubuntu-latest)
          - os: windows-latest
            optional: true
            name: check (windows-latest, optional)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify
        run: go run ./scripts/check
