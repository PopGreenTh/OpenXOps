name: environment-unresolved
why: >
  When the App resolves but no Environment is found (no account entry, OU link, LZ default or
  global default sets one), the Environment is unspec with finding environment-unresolved
  (subject: account ID). This holds for a shared account too: its Apps resolved through its
  account entry, so its Environment is unspec, not unalloc.
taxonomy:
  tenant: testtnt
  business_units: [{ code: retail, name: Retail }]
  cost_centers: [{ code: ecom, name: E-commerce, business_unit: retail }]
  projects: [{ code: shop, name: Online shop, business_unit: retail }]
  apps:
    - { code: chk, name: Checkout, project: shop, cost_center: ecom,
        environments: [{ code: prod, name: Production }] }
    - { code: pay, name: Payments, project: shop, cost_center: ecom,
        environments: [{ code: prod, name: Production }] }
  lzs: [{ code: main, name: Main, csp: aws, currency: USD, management_account: "111111111111" }]
  ou_links:
    - { lz: main, ou: /Workloads, app: chk }
  accounts:
    - { account: "200000000002", apps: [chk, pay] }
records:
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: r-1, name: Root, parent_id: "", path: /, id_path: r-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-1, name: Workloads, parent_id: r-1, path: /Workloads, id_path: r-1/ou-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-2, name: Team, parent_id: ou-1, path: /Workloads/Team, id_path: r-1/ou-1/ou-2, has_children: false }
  - { kind: account, csp: aws, org_id: o-main, management_account: "111111111111", id: "200000000001", name: team, email: team@example.com, status: ACTIVE, parent_id: ou-2, ou_path: /Workloads/Team, ou_id_path: r-1/ou-1/ou-2 }
  - { kind: account, csp: aws, org_id: o-main, management_account: "111111111111", id: "200000000002", name: shared, email: shared@example.com, status: ACTIVE, parent_id: r-1, ou_path: /, ou_id_path: r-1 }
expect:
  allocations:
    - { account_id: "200000000001", lz: main, app: chk, environment: unspec, app_rule: "ou:/Workloads",
        environment_rule: unspec, shared: false,
        environment_urn: "urn:tnt:testtnt:prj:shop:app:chk:env:unspec",
        ou_urn: "urn:tnt:testtnt:lzc:main:org:workloads/team" }
    - { account_id: "200000000002", lz: main, app: chk, environment: unspec, app_rule: account,
        environment_rule: unspec, shared: true }
    - { account_id: "200000000002", lz: main, app: pay, environment: unspec, app_rule: account,
        environment_rule: unspec, shared: true }
  findings:
    - { code: environment-unresolved, subject: "200000000001" }
    - { code: environment-unresolved, subject: "200000000002" }
