name: account-entry-beats-ou
why: The account's own entry wins over every OU link, for the App and the Environment alike.
taxonomy:
  business_units: [{ code: BU-RETAIL, name: Retail }]
  cost_centers: [{ code: CC-ECOM, name: E-commerce, business_unit: BU-RETAIL }]
  projects:
    - { code: PRJ-SHOP, name: Online shop, business_unit: BU-RETAIL }
    - { code: PRJ-PAY, name: Payments, business_unit: BU-RETAIL }
  apps:
    - { code: APP-CHK, name: Checkout, project: PRJ-SHOP, cost_center: CC-ECOM,
        environments: [{ code: ENV-PROD, name: Production }, { code: ENV-DEV, name: Development }] }
    - { code: APP-PAY, name: Payments, project: PRJ-PAY, cost_center: CC-ECOM,
        environments: [{ code: ENV-PROD, name: Production }, { code: ENV-DEV, name: Development }] }
  lzs: [{ code: LZ-MAIN, name: Main, csp: aws, currency: USD, management_account: "111111111111" }]
  ou_links:
    - { lz: LZ-MAIN, ou: /Workloads/Checkout, app: APP-CHK }
    - { lz: LZ-MAIN, ou: /Workloads/Checkout/Prod, environment: ENV-PROD }
  accounts:
    - { account: "200000000001", apps: [APP-PAY], environment: ENV-DEV }
records:
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: r-1, name: Root, parent_id: "", path: /, id_path: r-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-1, name: Workloads, parent_id: r-1, path: /Workloads, id_path: r-1/ou-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-2, name: Checkout, parent_id: ou-1, path: /Workloads/Checkout, id_path: r-1/ou-1/ou-2, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-3, name: Prod, parent_id: ou-2, path: /Workloads/Checkout/Prod, id_path: r-1/ou-1/ou-2/ou-3, has_children: false }
  - { kind: account, csp: aws, org_id: o-main, management_account: "111111111111", id: "200000000001", name: chk-prod, email: chk-prod@example.com, status: ACTIVE, parent_id: ou-3, ou_path: /Workloads/Checkout/Prod, ou_id_path: r-1/ou-1/ou-2/ou-3 }
expect:
  allocations:
    - { account_id: "200000000001", lz: LZ-MAIN, project: PRJ-PAY, app: APP-PAY, environment: ENV-DEV, app_rule: account,
        environment_rule: account, shared: false }
  findings: []
