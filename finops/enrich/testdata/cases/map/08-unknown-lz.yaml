name: unknown-lz
why: >
  An organization whose management account matches no LZ maps every account to unalloc and
  every level to UNALLOC, with one finding for the organization; no other rule runs.
taxonomy:
  tenant: testtnt
  business_units: [{ code: retail, name: Retail }]
  cost_centers: [{ code: ecom, name: E-commerce, business_unit: retail }]
  projects: [{ code: shop, name: Online shop, business_unit: retail }]
  apps:
    - { code: chk, name: Checkout, project: shop, cost_center: ecom,
        environments: [{ code: prod, name: Production }] }
  lzs: [{ code: main, name: Main, csp: aws, currency: USD, management_account: "111111111111" }]
  defaults: { app: chk, environment: prod }
records:
  - { kind: ou, csp: aws, org_id: o-other, management_account: "999999999999", id: r-9, name: Root, parent_id: "", path: /, id_path: r-9, has_children: false }
  - { kind: account, csp: aws, org_id: o-other, management_account: "999999999999", id: "900000000001", name: stray, email: stray@example.com, status: ACTIVE, parent_id: r-9, ou_path: /, ou_id_path: r-9 }
expect:
  allocations:
    - { account_id: "900000000001", lz: unalloc, project: unalloc, app: unalloc,
        environment: unalloc, business_unit: unalloc, cost_center: unalloc,
        app_rule: unalloc, environment_rule: unalloc, shared: false,
        business_unit_urn: "urn:tnt:testtnt:bzu:unalloc", cost_center_urn: "urn:tnt:testtnt:bzu:unalloc:cct:unalloc",
        project_urn: "urn:tnt:testtnt:prj:unalloc", app_urn: "urn:tnt:testtnt:prj:unalloc:app:unalloc",
        environment_urn: "urn:tnt:testtnt:prj:unalloc:app:unalloc:env:unalloc", lz_urn: "urn:tnt:testtnt:lzc:unalloc",
        ou_urn: "urn:tnt:testtnt:lzc:unalloc:org:root", account_urn: "urn:tnt:testtnt:lzc:unalloc:org:root:acc:900000000001" }
  findings:
    - { code: lz-unknown, subject: o-other }
