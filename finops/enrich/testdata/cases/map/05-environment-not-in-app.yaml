name: environment-not-in-app
why: >
  A resolved Environment that is not defined under the account's App becomes unspec with a
  finding. Here the global default qa exists only under pay.
taxonomy:
  tenant: testtnt
  business_units: [{ code: retail, name: Retail }]
  cost_centers: [{ code: ecom, name: E-commerce, business_unit: retail }]
  projects:
    - { code: shop, name: Online shop, business_unit: retail }
    - { code: pay, name: Payments, business_unit: retail }
  apps:
    - { code: chk, name: Checkout, project: shop, cost_center: ecom,
        environments: [{ code: prod, name: Production }] }
    - { code: pay, name: Payments, project: pay, cost_center: ecom,
        environments: [{ code: qa, name: Quality }] }
  lzs: [{ code: main, name: Main, csp: aws, currency: USD, management_account: "111111111111" }]
  ou_links:
    - { lz: main, ou: /Workloads/Checkout, app: chk }
  defaults: { environment: qa }
records:
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: r-1, name: Root, parent_id: "", path: /, id_path: r-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-1, name: Workloads, parent_id: r-1, path: /Workloads, id_path: r-1/ou-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-2, name: Checkout, parent_id: ou-1, path: /Workloads/Checkout, id_path: r-1/ou-1/ou-2, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-3, name: Prod, parent_id: ou-2, path: /Workloads/Checkout/Prod, id_path: r-1/ou-1/ou-2/ou-3, has_children: false }
  - { kind: account, csp: aws, org_id: o-main, management_account: "111111111111", id: "200000000001", name: chk-prod, email: chk-prod@example.com, status: ACTIVE, parent_id: ou-3, ou_path: /Workloads/Checkout/Prod, ou_id_path: r-1/ou-1/ou-2/ou-3 }
expect:
  allocations:
    - { account_id: "200000000001", lz: main, app: chk, environment: unspec, app_rule: "ou:/Workloads/Checkout",
        environment_rule: unspec, shared: false }
  findings:
    - { code: environment-not-in-app, subject: 200000000001/chk }
