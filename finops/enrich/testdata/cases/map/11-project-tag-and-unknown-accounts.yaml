name: project-tag-and-unknown-accounts
why: >
  The taxonomy wins over the Project tag (D-009): a disagreeing tag is reported, an agreeing or
  empty one is not. Cost of an account missing from the input keeps its LZ and is UNALLOC
  below it. An account entry for an account missing from the input is reported.
taxonomy:
  tenant: { code: testtnt, name: Test tenant }
  business_units:
    - code: retail
      name: Retail
      cost_centers:
        - { code: ecom, name: E-commerce }
  projects:
    - code: shop
      name: Online shop
      ref_urn_bu: urn:tnt:testtnt:bzu:retail
      apps:
        - code: chk
          name: Checkout
          ref_urn_cct: urn:tnt:testtnt:bzu:retail:cct:ecom
          environments: [{ code: prod, name: Production }, { code: dev, name: Development }]
    - code: pay
      name: Payments
      ref_urn_bu: urn:tnt:testtnt:bzu:retail
      apps:
        - code: pay
          name: Payments
          ref_urn_cct: urn:tnt:testtnt:bzu:retail:cct:ecom
          environments: [{ code: prod, name: Production }, { code: dev, name: Development }]
  lzs:
    - code: main
      name: Main
      csp: aws
      currency: USD
      management_account: "111111111111"
      ou_paths:
        - code: prod
          name: Prod
          path: /Workloads/Checkout/Prod
          accounts:
            - code: chk-prod
              name: chk-prod
              ref_id: "200000000001"
              ref_urn_apps: [urn:tnt:testtnt:prj:shop:app:chk]
              ref_urn_env: urn:tnt:testtnt:prj:shop:app:chk:env:prod
        - code: root
          name: Root
          path: /
          accounts:
            - code: acct-400000000004
              name: acct-400000000004
              ref_id: "400000000004"
              ref_urn_apps: [urn:tnt:testtnt:prj:pay:app:pay]
              ref_urn_env: urn:tnt:testtnt:prj:pay:app:pay:env:prod
records:
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: r-1, name: Root, parent_id: "", path: /, id_path: r-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-1, name: Workloads, parent_id: r-1, path: /Workloads, id_path: r-1/ou-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-2, name: Checkout, parent_id: ou-1, path: /Workloads/Checkout, id_path: r-1/ou-1/ou-2, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-3, name: Prod, parent_id: ou-2, path: /Workloads/Checkout/Prod, id_path: r-1/ou-1/ou-2/ou-3, has_children: false }
  - { kind: account, csp: aws, org_id: o-main, management_account: "111111111111", id: "200000000001", name: chk-prod, email: chk-prod@example.com, status: ACTIVE, parent_id: ou-3, ou_path: /Workloads/Checkout/Prod, ou_id_path: r-1/ou-1/ou-2/ou-3 }
  - { kind: project_tag_cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, project_tag: shop, amount: 60, currency: USD, estimated: false }
  - { kind: project_tag_cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, project_tag: other, amount: 30, currency: USD, estimated: false }
  - { kind: project_tag_cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, project_tag: "", amount: 10, currency: USD, estimated: false }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "300000000009", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonS3, app_tag: "", amount: 5, currency: USD, estimated: false }
expect:
  allocations:
    - { account_id: "200000000001", lz: main, project: shop, app: chk, environment: prod, app_rule: account,
        environment_rule: account, shared: false }
  costs:
    - { account_id: "300000000009", lz: main, project: unalloc, app: unalloc,
        environment: unalloc, business_unit: unalloc, cost_center: unalloc,
        app_rule: unalloc, environment_rule: unalloc, shared: false, amount: 5 }
  findings:
    - { code: project-tag-mismatch, subject: 200000000001/other }
    - { code: account-not-in-inventory, subject: "300000000009" }
    - { code: account-not-discovered, subject: "400000000004" }
