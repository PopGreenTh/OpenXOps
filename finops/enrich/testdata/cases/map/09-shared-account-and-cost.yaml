name: shared-account-and-cost
why: >
  An account entry may list several Apps (D-015): one allocation per App, marked shared. Its cost
  gets the LZ and Environment but no App, for share to split. A dedicated account's cost gets all
  of its allocation. Amounts never change.
taxonomy:
  tenant: testtnt
  business_units: [{ code: retail, name: Retail }]
  cost_centers: [{ code: ecom, name: E-commerce, business_unit: retail }]
  projects:
    - { code: shop, name: Online shop, business_unit: retail }
    - { code: pay, name: Payments, business_unit: retail }
  apps:
    - { code: chk, name: Checkout, project: shop, cost_center: ecom,
        environments: [{ code: prod, name: Production }, { code: dev, name: Development }] }
    - { code: pay, name: Payments, project: pay, cost_center: ecom,
        environments: [{ code: prod, name: Production }, { code: dev, name: Development }] }
  lzs: [{ code: main, name: Main, csp: aws, currency: USD, management_account: "111111111111" }]
  ou_links:
    - { lz: main, ou: /Workloads/Checkout, app: chk }
    - { lz: main, ou: /Workloads/Checkout/Prod, environment: prod }
  accounts:
    - { account: "200000000002", apps: [chk, pay], environment: prod }
records:
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: r-1, name: Root, parent_id: "", path: /, id_path: r-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-1, name: Workloads, parent_id: r-1, path: /Workloads, id_path: r-1/ou-1, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-2, name: Checkout, parent_id: ou-1, path: /Workloads/Checkout, id_path: r-1/ou-1/ou-2, has_children: true }
  - { kind: ou, csp: aws, org_id: o-main, management_account: "111111111111", id: ou-3, name: Prod, parent_id: ou-2, path: /Workloads/Checkout/Prod, id_path: r-1/ou-1/ou-2/ou-3, has_children: false }
  - { kind: account, csp: aws, org_id: o-main, management_account: "111111111111", id: "200000000001", name: chk-prod, email: chk-prod@example.com, status: ACTIVE, parent_id: ou-3, ou_path: /Workloads/Checkout/Prod, ou_id_path: r-1/ou-1/ou-2/ou-3 }
  - { kind: account, csp: aws, org_id: o-main, management_account: "111111111111", id: "200000000002", name: shared, email: shared@example.com, status: ACTIVE, parent_id: r-1, ou_path: /, ou_id_path: r-1 }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: "", amount: 100, currency: USD, estimated: false }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000002", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: pay, amount: 40, currency: USD, estimated: false }
expect:
  allocations:
    - { account_id: "200000000001", lz: main, app: chk, environment: prod, shared: false }
    - { account_id: "200000000002", lz: main, project: shop, app: chk, environment: prod,
        app_rule: account, environment_rule: account, shared: true }
    - { account_id: "200000000002", lz: main, project: pay, app: pay, environment: prod,
        app_rule: account, environment_rule: account, shared: true }
  costs:
    - { account_id: "200000000001", lz: main, project: shop, app: chk, environment: prod,
        business_unit: retail, cost_center: ecom, app_rule: "ou:/Workloads/Checkout",
        environment_rule: "ou:/Workloads/Checkout/Prod", shared: false, amount: 100, tenant: testtnt,
        project_urn: "urn:tnt:testtnt:prj:shop", app_urn: "urn:tnt:testtnt:prj:shop:app:chk",
        environment_urn: "urn:tnt:testtnt:prj:shop:app:chk:env:prod",
        business_unit_urn: "urn:tnt:testtnt:bzu:retail", cost_center_urn: "urn:tnt:testtnt:bzu:retail:cct:ecom",
        lz_urn: "urn:tnt:testtnt:lzc:main", ou_urn: "urn:tnt:testtnt:lzc:main:org:workloads/checkout/prod",
        account_urn: "urn:tnt:testtnt:lzc:main:org:workloads/checkout/prod:acc:200000000001",
        service_urn: "urn:tnt:testtnt:lzc:main:org:workloads/checkout/prod:acc:200000000001:svc:amazon-ec2" }
    - { account_id: "200000000002", lz: main, project: "", app: "", environment: prod,
        app_rule: "", environment_rule: account, shared: true, app_tag: pay, amount: 40,
        project_urn: "", app_urn: "", environment_urn: "", business_unit_urn: "", cost_center_urn: "",
        lz_urn: "urn:tnt:testtnt:lzc:main", ou_urn: "urn:tnt:testtnt:lzc:main:org:root",
        account_urn: "urn:tnt:testtnt:lzc:main:org:root:acc:200000000002",
        service_urn: "urn:tnt:testtnt:lzc:main:org:root:acc:200000000002:svc:amazon-ec2" }
  findings: []
