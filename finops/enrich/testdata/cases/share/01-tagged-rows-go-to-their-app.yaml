name: tagged-rows-go-to-their-app
why: >
  A shared account's row tagged with one of its Apps goes whole to that App. Tags match App codes
  ignoring case and surrounding spaces (D-016).
taxonomy:
  tenant: { code: testtnt, name: Test tenant }
  business_units:
    - code: retail
      name: Retail
      cost_centers:
        - { code: ecom, name: E-commerce }
  projects:
    - code: shop
      name: Online shop
      ref_urn_bu: urn:tnt:testtnt:bzu:retail
      apps:
        - code: aaa
          name: AAA
          ref_urn_cct: urn:tnt:testtnt:bzu:retail:cct:ecom
          environments: [{ code: prod, name: Production }]
        - code: bbb
          name: BBB
          ref_urn_cct: urn:tnt:testtnt:bzu:retail:cct:ecom
          environments: [{ code: prod, name: Production }]
        - code: ccc
          name: CCC
          ref_urn_cct: urn:tnt:testtnt:bzu:retail:cct:ecom
          environments: [{ code: prod, name: Production }]
  lzs:
    - code: main
      name: Main
      csp: aws
      currency: USD
      management_account: "111111111111"
      ou_paths:
        - code: root
          name: Root
          path: /
          accounts:
            - code: acct-200000000001
              name: acct-200000000001
              ref_id: "200000000001"
              ref_urn_apps: [urn:tnt:testtnt:prj:shop:app:aaa, urn:tnt:testtnt:prj:shop:app:bbb]
              ref_urn_env: urn:tnt:testtnt:prj:shop:app:aaa:env:prod
            - code: acct-200000000002
              name: acct-200000000002
              ref_id: "200000000002"
              ref_urn_apps: [urn:tnt:testtnt:prj:shop:app:ccc]
              ref_urn_env: urn:tnt:testtnt:prj:shop:app:ccc:env:prod
            - code: acct-200000000003
              name: acct-200000000003
              ref_id: "200000000003"
              ref_urn_apps: [urn:tnt:testtnt:prj:shop:app:aaa, urn:tnt:testtnt:prj:shop:app:bbb, urn:tnt:testtnt:prj:shop:app:ccc]
              ref_urn_env: urn:tnt:testtnt:prj:shop:app:aaa:env:prod
records:
  - { kind: allocation, account_id: "200000000001", account_name: acct-200000000001, lz: main, ou_path: /, project: shop, app: aaa, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000001", account_name: acct-200000000001, lz: main, ou_path: /, project: shop, app: bbb, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000002", account_name: acct-200000000002, lz: main, ou_path: /, project: shop, app: ccc, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: false }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: aaa, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: bbb, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: ccc, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: "AAA", amount: 40, currency: USD, estimated: false, lz: main, environment: prod, environment_rule: account, shared: true, project: "", app: "", business_unit: "", cost_center: "", app_rule: "" }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: " bbb ", amount: 60, currency: USD, estimated: false, lz: main, environment: prod, environment_rule: account, shared: true, project: "", app: "", business_unit: "", cost_center: "", app_rule: "" }
expect:
  costs:
    - { account_id: "200000000001", app: aaa, project: shop, business_unit: retail, cost_center: ecom, app_rule: account, amount: 40, source_amount: 40, share: 1, share_rule: tag,
        project_urn: "urn:tnt:testtnt:prj:shop", app_urn: "urn:tnt:testtnt:prj:shop:app:aaa", environment_urn: "urn:tnt:testtnt:prj:shop:app:aaa:env:prod",
        business_unit_urn: "urn:tnt:testtnt:bzu:retail", cost_center_urn: "urn:tnt:testtnt:bzu:retail:cct:ecom" }
    - { account_id: "200000000001", app: bbb, project: shop, amount: 60, source_amount: 60, share: 1, share_rule: tag }
  findings: []
