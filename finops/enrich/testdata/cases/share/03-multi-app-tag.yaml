name: multi-app-tag
why: >
  A tag may list several Apps separated by "," or "__" (D-016). The row is split equally between
  the listed parts and each part is judged alone (D-021): a part naming a real App the account
  doesn't serve goes to invalid. Empty parts are dropped, so ",bbb," is a single App.
taxonomy:
  tenant: testtnt
  business_units: [{ code: retail, name: Retail }]
  cost_centers: [{ code: ecom, name: E-commerce, business_unit: retail }]
  projects: [{ code: shop, name: Online shop, business_unit: retail }]
  apps:
    - { code: aaa, name: AAA, project: shop, cost_center: ecom, environments: [{ code: prod, name: Production }] }
    - { code: bbb, name: BBB, project: shop, cost_center: ecom, environments: [{ code: prod, name: Production }] }
    - { code: ccc, name: CCC, project: shop, cost_center: ecom, environments: [{ code: prod, name: Production }] }
  lzs: [{ code: main, name: Main, csp: aws, currency: USD, management_account: "111111111111" }]
  accounts:
    - { account: "200000000001", apps: [aaa, bbb], environment: prod }
    - { account: "200000000002", apps: [ccc], environment: prod }
    - { account: "200000000003", apps: [aaa, bbb, ccc], environment: prod }
records:
  - { kind: allocation, account_id: "200000000001", account_name: acct-200000000001, lz: main, ou_path: /, project: shop, app: aaa, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000001", account_name: acct-200000000001, lz: main, ou_path: /, project: shop, app: bbb, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000002", account_name: acct-200000000002, lz: main, ou_path: /, project: shop, app: ccc, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: false }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: aaa, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: bbb, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: ccc, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: "aaa,bbb", amount: 80, currency: USD, estimated: false, lz: main, environment: prod, environment_rule: account, shared: true, project: "", app: "", business_unit: "", cost_center: "", app_rule: "" }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: "AAA__ccc", amount: 20, currency: USD, estimated: false, lz: main, environment: prod, environment_rule: account, shared: true, project: "", app: "", business_unit: "", cost_center: "", app_rule: "" }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000001", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: ",bbb,", amount: 30, currency: USD, estimated: false, lz: main, environment: prod, environment_rule: account, shared: true, project: "", app: "", business_unit: "", cost_center: "", app_rule: "" }
expect:
  costs:
    - { account_id: "200000000001", app: aaa, amount: 10, source_amount: 20, share: 0.5, share_rule: tag-multi }
    - { account_id: "200000000001", app: aaa, amount: 40, source_amount: 80, share: 0.5, share_rule: tag-multi }
    - { account_id: "200000000001", app: bbb, amount: 30, source_amount: 30, share: 1, share_rule: tag }
    - { account_id: "200000000001", app: bbb, amount: 40, source_amount: 80, share: 0.5, share_rule: tag-multi }
    - { account_id: "200000000001", app: invalid, project: unalloc, business_unit: unalloc, cost_center: unalloc, environment: prod, app_rule: invalid, amount: 10, source_amount: 20, share: 0.5, share_rule: tag-multi }
  findings:
    - { code: shared-tag-wrong-app, subject: 200000000001/ccc }
