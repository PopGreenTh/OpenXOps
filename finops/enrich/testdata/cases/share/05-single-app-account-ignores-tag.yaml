name: single-app-account-ignores-tag
why: >
  Only shared accounts are split. A single-App account's cost keeps the App map gave it, whatever
  its tag says, and is marked single.
taxonomy:
  business_units: [{ code: BU-RETAIL, name: Retail }]
  cost_centers: [{ code: CC-ECOM, name: E-commerce, business_unit: BU-RETAIL }]
  projects: [{ code: PRJ-SHOP, name: Online shop, business_unit: BU-RETAIL }]
  apps:
    - { code: APP-A, name: A, project: PRJ-SHOP, cost_center: CC-ECOM, environments: [{ code: ENV-PROD, name: Production }] }
    - { code: APP-B, name: B, project: PRJ-SHOP, cost_center: CC-ECOM, environments: [{ code: ENV-PROD, name: Production }] }
    - { code: APP-C, name: C, project: PRJ-SHOP, cost_center: CC-ECOM, environments: [{ code: ENV-PROD, name: Production }] }
  lzs: [{ code: LZ-MAIN, name: Main, csp: aws, currency: USD, management_account: "111111111111" }]
  accounts:
    - { account: "200000000001", apps: [APP-A, APP-B], environment: ENV-PROD }
    - { account: "200000000002", apps: [APP-C], environment: ENV-PROD }
    - { account: "200000000003", apps: [APP-A, APP-B, APP-C], environment: ENV-PROD }
records:
  - { kind: allocation, account_id: "200000000001", account_name: acct-200000000001, lz: LZ-MAIN, ou_path: /, project: PRJ-SHOP, app: APP-A, environment: ENV-PROD, business_unit: BU-RETAIL, cost_center: CC-ECOM, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000001", account_name: acct-200000000001, lz: LZ-MAIN, ou_path: /, project: PRJ-SHOP, app: APP-B, environment: ENV-PROD, business_unit: BU-RETAIL, cost_center: CC-ECOM, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000002", account_name: acct-200000000002, lz: LZ-MAIN, ou_path: /, project: PRJ-SHOP, app: APP-C, environment: ENV-PROD, business_unit: BU-RETAIL, cost_center: CC-ECOM, app_rule: account, environment_rule: account, shared: false }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: LZ-MAIN, ou_path: /, project: PRJ-SHOP, app: APP-A, environment: ENV-PROD, business_unit: BU-RETAIL, cost_center: CC-ECOM, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: LZ-MAIN, ou_path: /, project: PRJ-SHOP, app: APP-B, environment: ENV-PROD, business_unit: BU-RETAIL, cost_center: CC-ECOM, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: LZ-MAIN, ou_path: /, project: PRJ-SHOP, app: APP-C, environment: ENV-PROD, business_unit: BU-RETAIL, cost_center: CC-ECOM, app_rule: account, environment_rule: account, shared: true }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000002", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: APP-A, amount: 70, currency: USD, estimated: false, lz: LZ-MAIN, environment: ENV-PROD, environment_rule: account, shared: false, project: PRJ-SHOP, app: APP-C, business_unit: BU-RETAIL, cost_center: CC-ECOM, app_rule: account }
expect:
  costs:
    - { account_id: "200000000002", app: APP-C, amount: 70, source_amount: 70, share: 1, share_rule: single }
  findings: []
