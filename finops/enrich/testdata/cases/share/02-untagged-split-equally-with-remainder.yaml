name: untagged-split-equally-with-remainder
why: >
  An untagged row of a shared account is split equally between all its Apps. Ordered by App code,
  every part but the last is amount x share and the last takes the rest, so the parts add up to
  the row exactly. The missing tag is still reported, and since no shared row in the input carries
  any tag, so is app-tag-not-seen.
taxonomy:
  tenant: testtnt
  business_units: [{ code: retail, name: Retail }]
  cost_centers: [{ code: ecom, name: E-commerce, business_unit: retail }]
  projects: [{ code: shop, name: Online shop, business_unit: retail }]
  apps:
    - { code: a, name: A, project: shop, cost_center: ecom, environments: [{ code: prod, name: Production }] }
    - { code: b, name: B, project: shop, cost_center: ecom, environments: [{ code: prod, name: Production }] }
    - { code: c, name: C, project: shop, cost_center: ecom, environments: [{ code: prod, name: Production }] }
  lzs: [{ code: main, name: Main, csp: aws, currency: USD, management_account: "111111111111" }]
  accounts:
    - { account: "200000000001", apps: [a, b], environment: prod }
    - { account: "200000000002", apps: [c], environment: prod }
    - { account: "200000000003", apps: [a, b, c], environment: prod }
records:
  - { kind: allocation, account_id: "200000000001", account_name: acct-200000000001, lz: main, ou_path: /, project: shop, app: a, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000001", account_name: acct-200000000001, lz: main, ou_path: /, project: shop, app: b, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000002", account_name: acct-200000000002, lz: main, ou_path: /, project: shop, app: c, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: false }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: a, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: b, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: allocation, account_id: "200000000003", account_name: acct-200000000003, lz: main, ou_path: /, project: shop, app: c, environment: prod, business_unit: retail, cost_center: ecom, app_rule: account, environment_rule: account, shared: true }
  - { kind: cost, csp: aws, management_account: "111111111111", account_id: "200000000003", granularity: monthly, period: 2026-09, metric: UnblendedCost, service: AmazonEC2, app_tag: "", amount: 10, currency: USD, estimated: false, lz: main, environment: prod, environment_rule: account, shared: true, project: "", app: "", business_unit: "", cost_center: "", app_rule: "" }
expect:
  costs:
    - { account_id: "200000000003", app: a, amount: 3.333333333, source_amount: 10, share: 0.333333333, share_rule: untagged-equal }
    - { account_id: "200000000003", app: b, amount: 3.333333333, source_amount: 10, share: 0.333333333, share_rule: untagged-equal }
    - { account_id: "200000000003", app: c, amount: 3.333333334, source_amount: 10, share: 0.333333333, share_rule: untagged-equal }
  findings:
    - { code: shared-untagged, subject: 200000000003/2026-09 }
    - { code: app-tag-not-seen, subject: App }
