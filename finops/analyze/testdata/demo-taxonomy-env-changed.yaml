tenant: { code: testtnt, name: Test tenant }
business_units:
  - code: retail
    name: Retail
    cost_centers:
      - { code: ecom, name: E-commerce }
  - code: digital
    name: Digital
    cost_centers:
      - { code: pay, name: Payments }
projects:
  - code: shop
    name: Online shop
    ref_urn_bu: urn:tnt:testtnt:bzu:retail
    apps:
      - code: chk
        name: Checkout
        ref_urn_cct: urn:tnt:testtnt:bzu:retail:cct:ecom
        environments:
          - { code: prod, name: Production }
          - { code: nonprod, name: Non-production }
  - code: pay
    name: Payments platform
    ref_urn_bu: urn:tnt:testtnt:bzu:digital
    apps:
      - code: pay
        name: Payments
        ref_urn_cct: urn:tnt:testtnt:bzu:digital:cct:pay
        environments:
          - { code: prod, name: Production }
          - { code: nonprod, name: Non-production }
lzs:
  - code: main
    name: Main
    csp: aws
    currency: USD
    management_account: "111111111111"
    ou_paths:
      - code: checkout
        name: Checkout
        path: /Workloads/Checkout
        ref_urn_apps: [urn:tnt:testtnt:prj:shop:app:chk]
      - code: checkout-prod
        name: Prod
        path: /Workloads/Checkout/Prod
        ref_urn_env: urn:tnt:testtnt:prj:shop:app:chk:env:nonprod
      - code: checkout-nonprod
        name: NonProd
        path: /Workloads/Checkout/NonProd
        ref_urn_env: urn:tnt:testtnt:prj:shop:app:chk:env:nonprod
      - code: payments
        name: Payments
        path: /Workloads/Payments
        ref_urn_apps: [urn:tnt:testtnt:prj:pay:app:pay]
      - code: payments-prod
        name: Prod
        path: /Workloads/Payments/Prod
        ref_urn_env: urn:tnt:testtnt:prj:pay:app:pay:env:prod
      - code: payments-nonprod
        name: NonProd
        path: /Workloads/Payments/NonProd
        ref_urn_env: urn:tnt:testtnt:prj:pay:app:pay:env:nonprod
      - code: root
        name: Root
        path: /
        accounts:
          # The mock cost has rows for an account outside the inventory. Its URN holds this code
          # instead of the account id.
          - { code: outside-inventory, name: Outside the inventory, ref_id: "299999999999" }
      - code: shared
        name: Shared
        path: /Shared
        accounts:
          - code: shared-platform
            name: shared-platform
            ref_id: "200000000002"
            ref_urn_apps: [urn:tnt:testtnt:prj:shop:app:chk, urn:tnt:testtnt:prj:pay:app:pay]
            ref_urn_env: urn:tnt:testtnt:prj:shop:app:chk:env:prod
tags: { app: App, project: Project }
