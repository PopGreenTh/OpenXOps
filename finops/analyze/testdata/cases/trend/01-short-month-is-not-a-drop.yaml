name: short-month-is-not-a-drop
why: >
  Equal spend per day gives equal daily averages, so February's lower total (28 days) is not a
  drop. January has no earlier period, so no baseline; later months average the earlier ones.
args: { hierarchy: project, as_of: "2026-05-10" }
records:
  - { kind: cost, account_id: "200000000001", service: AmazonEC2, project: shop, app: chk, environment: prod, project_urn: "urn:tnt:testtnt:prj:shop", app_urn: "urn:tnt:testtnt:prj:shop:app:chk", environment_urn: "urn:tnt:testtnt:prj:shop:app:chk:env:prod", period: 2026-01, metric: UnblendedCost, currency: USD, amount: 310 }
  - { kind: cost, account_id: "200000000001", service: AmazonEC2, project: shop, app: chk, environment: prod, project_urn: "urn:tnt:testtnt:prj:shop", app_urn: "urn:tnt:testtnt:prj:shop:app:chk", environment_urn: "urn:tnt:testtnt:prj:shop:app:chk:env:prod", period: 2026-02, metric: UnblendedCost, currency: USD, amount: 280 }
  - { kind: cost, account_id: "200000000001", service: AmazonEC2, project: shop, app: chk, environment: prod, project_urn: "urn:tnt:testtnt:prj:shop", app_urn: "urn:tnt:testtnt:prj:shop:app:chk", environment_urn: "urn:tnt:testtnt:prj:shop:app:chk:env:prod", period: 2026-03, metric: UnblendedCost, currency: USD, amount: 310 }
  - { kind: cost, account_id: "200000000001", service: AmazonEC2, project: shop, app: chk, environment: prod, project_urn: "urn:tnt:testtnt:prj:shop", app_urn: "urn:tnt:testtnt:prj:shop:app:chk", environment_urn: "urn:tnt:testtnt:prj:shop:app:chk:env:prod", period: 2026-04, metric: UnblendedCost, currency: USD, amount: 300 }
