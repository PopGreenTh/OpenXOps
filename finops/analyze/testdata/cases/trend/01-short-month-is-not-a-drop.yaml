        amount: 310, days: 31, open: false, daily_avg: 10, baseline_periods: 0, baseline_daily_avg: null, factor: null }
    - { level: environment, node: "urn:tnt:testtnt:prj:shop:app:chk:env:prod", metric: UnblendedCost, currency: USD, period: 2026-02,
