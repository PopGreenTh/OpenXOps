name: cost-hierarchy-without-region
why: >
  The cost hierarchy takes each node's URN from the cost record: the OU from ou_urn, the account
  from account_urn (D-067). No cost record has a region (Cost Explorer input), so the region
  level is skipped: the levels are ou, account and service. Two currencies stay apart.
args: { hierarchy: cost, as_of: "2026-10-15" }
records:
  - { kind: cost, account_id: "200000000001", service: AmazonEC2, period: 2026-08, metric: UnblendedCost, currency: USD, amount: 310,
      ou_urn: "urn:tnt:testtnt:lzc:main:org:prod", account_urn: "urn:tnt:testtnt:lzc:main:org:prod:acc:chk-prod" }
  - { kind: cost, account_id: "200000000001", service: AmazonEC2, period: 2026-09, metric: UnblendedCost, currency: USD, amount: 450,
      ou_urn: "urn:tnt:testtnt:lzc:main:org:prod", account_urn: "urn:tnt:testtnt:lzc:main:org:prod:acc:chk-prod" }
  - { kind: cost, account_id: "200000000001", service: AmazonS3, period: 2026-09, metric: UnblendedCost, currency: EUR, amount: 30,
      ou_urn: "urn:tnt:testtnt:lzc:main:org:prod", account_urn: "urn:tnt:testtnt:lzc:main:org:prod:acc:chk-prod" }
expect:
  trends:
    - { level: ou, node: "urn:tnt:testtnt:lzc:main:org:prod", ou_urn: "urn:tnt:testtnt:lzc:main:org:prod", account_id: "", service: "",
        metric: UnblendedCost, currency: USD, period: 2026-09, amount: 450, days: 30, daily_avg: 15,
        baseline_periods: 1, baseline_daily_avg: 10, factor: 1.5 }
    - { level: account, node: "urn:tnt:testtnt:lzc:main:org:prod:acc:chk-prod", metric: UnblendedCost, currency: USD, period: 2026-09,
        amount: 450, daily_avg: 15, factor: 1.5 }
    - { level: service, node: "urn:tnt:testtnt:lzc:main:org:prod:acc:chk-prod:svc:amazon-ec2", metric: UnblendedCost, currency: USD,
        period: 2026-09, amount: 450, daily_avg: 15, factor: 1.5 }
    - { level: service, node: "urn:tnt:testtnt:lzc:main:org:prod:acc:chk-prod:svc:amazon-s3", metric: UnblendedCost, currency: EUR,
        period: 2026-09, amount: 30, daily_avg: 1, baseline_periods: 0, factor: null }
  findings:
    - { code: trend-no-baseline, subject: "urn:tnt:testtnt:lzc:main:org:prod" }
    - { code: trend-no-baseline, subject: "urn:tnt:testtnt:lzc:main:org:prod:acc:chk-prod" }
    - { code: trend-no-baseline, subject: "urn:tnt:testtnt:lzc:main:org:prod:acc:chk-prod:svc:amazon-s3" }
