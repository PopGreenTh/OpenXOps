name: floor-factor-most-specific
why: >
  Floor and factor are chosen separately, each from the most specific entry that sets it: the
  longest URN that is the node's URN or a prefix of it (D-067).
  App app-a takes factor 3 from its own entry and floor 500 from Project prj-a's. App app-b rises
  450 a month, under the inherited floor 500. prj-b has no entry: defaults.
args:
  period: 2026-09
  floor_factor: |
    - { urn: "urn:tnt:testtnt:prj:prj-a", floor: 500 }
    - { urn: "urn:tnt:testtnt:prj:prj-a:app:app-a", factor: 3 }
records:
  - { kind: trend, hierarchy: project, level: project, node: "urn:tnt:testtnt:prj:prj-a", project: prj-a, app: "", environment: "", feature_tag: "", period: 2026-09, metric: UnblendedCost, currency: USD, amount: 1650, days: 30, open: false, daily_avg: 55, baseline_periods: 3, baseline_daily_avg: 20, factor: 2.75 }
  - { kind: trend, hierarchy: project, level: app, node: "urn:tnt:testtnt:prj:prj-a:app:app-a", project: prj-a, app: app-a, environment: "", feature_tag: "", period: 2026-09, metric: UnblendedCost, currency: USD, amount: 900, days: 30, open: false, daily_avg: 30, baseline_periods: 3, baseline_daily_avg: 10, factor: 3 }
  - { kind: trend, hierarchy: project, level: app, node: "urn:tnt:testtnt:prj:prj-a:app:app-b", project: prj-a, app: app-b, environment: "", feature_tag: "", period: 2026-09, metric: UnblendedCost, currency: USD, amount: 750, days: 30, open: false, daily_avg: 25, baseline_periods: 3, baseline_daily_avg: 10, factor: 2.5 }
  - { kind: trend, hierarchy: project, level: project, node: "urn:tnt:testtnt:prj:prj-b", project: prj-b, app: "", environment: "", feature_tag: "", period: 2026-09, metric: UnblendedCost, currency: USD, amount: 750, days: 30, open: false, daily_avg: 25, baseline_periods: 3, baseline_daily_avg: 10, factor: 2.5 }
expect:
  impacts:
    - { hierarchy: project, node: "urn:tnt:testtnt:prj:prj-a", impact_level: 1, status: new, delta_monthly: 1050, floor: 500, base_factor: 2 }
    - { hierarchy: project, node: "urn:tnt:testtnt:prj:prj-a:app:app-a", impact_level: 1, status: new, delta_monthly: 600, floor: 500, base_factor: 3 }
    - { hierarchy: project, node: "urn:tnt:testtnt:prj:prj-b", impact_level: 1, status: new, delta_monthly: 450, floor: 30, base_factor: 2 }
