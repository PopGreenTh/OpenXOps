name: open-month-run-rate
why: >
  The base daily cost is trend's baseline (D-069): the mean daily cost of the last 3 closed months
  with cost. August is 10 a day, September 20, October 30, so the base is 20; July (100 a day) is a fourth
  month and is left out. On 2026-11-10 the
  open month's 90 so far doesn't change it. November's run rate is 20 × 30, December's 20 × 31.
args: { as_of: "2026-11-10", months: 2 }
