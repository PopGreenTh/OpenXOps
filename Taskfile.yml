version: "3"

vars:
  EXE: '{{if eq OS "windows"}}.exe{{end}}'

tasks:
  default:
    cmds:
      - task: check

  build:
    desc: Build xops and finops into bin/
    cmds:
      - go build -o bin/xops{{.EXE}} ./xops
      - go build -o bin/finops{{.EXE}} ./finops

  check:
    desc: Verify (build, vet, gofmt, test)
    cmds:
      - go run ./scripts/check

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  run:xops:version:
    desc: Run xops version
    cmds:
      - go run ./xops version

  run:finops:version:
    desc: Run finops version
    cmds:
      - go run ./finops version

  run:finops:sense-aws-cost:
    desc: Run finops sense aws-cost with mock Cost Explorer data
    cmds:
      - go run ./finops sense aws-cost --mock

  run:finops:enrich-validate:
    desc: Validate the demo taxonomy
    cmds:
      - go run ./finops enrich validate --taxonomy finops/enrich/testdata/demo-taxonomy.yaml

  run:finops:enrich-map:
    desc: Map demo accounts with the demo taxonomy
    cmds:
      - go run ./finops enrich map --taxonomy finops/enrich/testdata/demo-taxonomy.yaml --from-accounts finops/enrich/testdata/demo-accounts.jsonl

  run:finops:enrich-share:
    desc: Share demo map fixture (shared account tag cases)
    cmds:
      - go run ./finops enrich share --taxonomy finops/enrich/testdata/demo-taxonomy.yaml --from-cost finops/enrich/testdata/demo-map.jsonl

  run:finops:analyze-changes:
    desc: Compare two demo map outputs (environment link change on Checkout/Prod)
    cmds:
      - go run ./finops enrich map --taxonomy finops/enrich/testdata/demo-taxonomy.yaml --from-accounts finops/enrich/testdata/demo-accounts.jsonl --from-cost finops/analyze/testdata/cost.jsonl > /tmp/openxops-map-before.jsonl
      - go run ./finops enrich map --taxonomy finops/analyze/testdata/demo-taxonomy-env-changed.yaml --from-accounts finops/enrich/testdata/demo-accounts.jsonl --from-cost finops/analyze/testdata/cost.jsonl > /tmp/openxops-map-now.jsonl
      - go run ./finops analyze changes --before /tmp/openxops-map-before.jsonl --from-map /tmp/openxops-map-now.jsonl

  run:xops:sense-aws-accounts:
    desc: Run xops sense aws-accounts on the demo organization
    cmds:
      - go run ./xops sense aws-accounts --mock

  run:xops:report-table:
    desc: Print report tables from mixed fixture
    cmds:
      - go run ./xops report table --from-cost xops/report/testdata/mixed.jsonl

  run:xops:report-csv:
    desc: Write CSV report from mixed fixture
    cmds:
      - go run ./xops report csv --out /tmp/xops-report-csv --from-cost xops/report/testdata/mixed.jsonl

  run:xops:report-excel:
    desc: Write Excel report from mixed fixture
    cmds:
      - go run ./xops report excel --out /tmp/xops-report.xlsx --from-cost xops/report/testdata/mixed.jsonl

  clean:
    desc: Remove built binaries
    cmds:
      - task: clean:posix
      - task: clean:windows

  clean:posix:
    platforms: [linux, darwin]
    internal: true
    cmds:
      - rm -rf bin

  clean:windows:
    platforms: [windows]
    internal: true
    cmds:
      - cmd /c if exist bin rmdir /s /q bin
